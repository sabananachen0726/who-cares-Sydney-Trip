<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYD | Ultimate Group Hub</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    input, select, textarea { box-sizing: border-box !important; max-width: 100% !important; -webkit-appearance: none; }
  </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen pb-32 font-sans antialiased">

  <!-- HEADER -->
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
      <h1 class="text-base font-black tracking-widest uppercase">SYDNEY <span class="text-pink-500">.</span> LUXE</h1>
      <button onclick="toggleLanguage()" class="text-[10px] font-black uppercase bg-pink-50 text-pink-600 px-3 py-2 rounded-full">🌐 EN</button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-6">
    
    <!-- 1. 住宿區塊 (保留) -->
    <section class="bg-white border rounded-2xl p-4 shadow-sm" onclick="openHotelEditor()">
      <span class="text-[8px] font-black text-pink-600 bg-pink-50 px-2 rounded-full uppercase">🏠 住宿大本營</span>
      <h3 class="text-sm font-bold mt-1.5" id="hotel-display-name">點擊設定飯店名稱</h3>
      <p class="text-xs text-gray-500" id="hotel-display-address">尚未設定地址</p>
    </section>

    <!-- 2. 分帳區塊 -->
    <div id="tab-tracker-content" class="space-y-4">
      <div class="bg-white border p-5 rounded-2xl shadow-sm">
        <p class="text-[10px] font-bold text-gray-400">總花費</p>
        <p class="text-3xl font-black" id="dash-total">A$ 0.00</p>
      </div>

      <section class="bg-white p-5 rounded-2xl border-2 border-slate-900 shadow-md space-y-3">
        <h3 class="text-xs font-black uppercase border-b pb-2">✍️ 快速記帳 / 分帳</h3>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="edit-store" placeholder="店名" class="w-full p-2 bg-gray-50 border rounded-xl text-xs">
          <select id="edit-paid-by" class="w-full p-2 bg-gray-50 border rounded-xl text-xs"></select>
        </div>
        <input type="number" id="edit-amount" step="0.01" value="0.00" class="w-full p-2 bg-gray-50 border rounded-xl text-xs font-bold text-pink-600">
        <div id="split-shares-container" class="space-y-1 bg-gray-50 p-2 rounded-xl text-xs"></div>
        <button onclick="saveBillFormCloud()" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs uppercase">同步至雲端</button>
      </section>

      <button onclick="toggleSettlement()" class="w-full py-2 bg-slate-100 text-[10px] font-bold rounded-lg uppercase">📊 顯示/隱藏 對帳結算</button>
      <section id="settlement-panel" class="hidden bg-white border-2 border-dashed p-4 rounded-2xl space-y-2">
        <div id="settlement-matrix-box" class="space-y-2 text-xs"></div>
      </section>
      
      <ul id="expense-list" class="space-y-2"></ul>
    </div>

    <!-- 3. 行程區塊 (移除飯店選項) -->
    <div id="tab-itinerary-content" class="hidden space-y-4">
        <!-- 行程卡片等邏輯維持不變 -->
    </div>

    <!-- 4. 許願池 (增加投票與分類) -->
    <div id="tab-wishlist-content" class="hidden space-y-4">
        <!-- 分類下拉與列表 -->
    </div>
  </main>

  <!-- FOOTER -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-3 flex justify-around">
    <button onclick="switchTab('tracker')" class="text-pink-600">🧾 分帳本</button>
    <button onclick="switchTab('itinerary')" class="text-gray-400">🗓️ 行程表</button>
    <button onclick="switchTab('wishlist')" class="text-gray-400">🎁 許願池</button>
  </nav>

  <script>
    // 這裡請務必接回你原本的 Firebase 初始化與所有邏輯函數
    // 確保 renderItinerarySelectOptions() 裡面移除了 "Hotel" 選項
    // 並補回 renderFinalSettlementMatrix() 計算邏輯
    bootstrapConfig();
  </script>
</body>
</html>
