<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYD | Ultimate Group Hub</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    input[type="date"], input[type="time"], input[type="datetime-local"] { -webkit-appearance: none; box-sizing: border-box !important; max-width: 100% !important; }
  </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen pb-32 font-sans antialiased">

  <header class="bg-white border-b sticky top-0 z-50 shadow-xs">
    <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
      <h1 class="text-base font-black uppercase">SYDNEY <span class="text-pink-500">.</span> LUXE</h1>
      <button onclick="toggleLanguage()" id="btn-lang-toggle" class="text-[10px] font-black uppercase bg-pink-50 text-pink-600 px-3 py-2 rounded-full">🌐 EN</button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-6">
    <!-- 住宿維持 -->
    <section class="bg-white border rounded-2xl p-4 shadow-sm" onclick="openHotelEditor()">
      <span class="text-[8px] font-black text-pink-600 bg-pink-50 px-2 rounded-full uppercase">🏠 住宿大本營</span>
      <h3 class="text-sm font-bold mt-1.5" id="hotel-display-name">點擊設定飯店名稱</h3>
      <p class="text-xs text-gray-500" id="hotel-display-address">尚未設定地址</p>
    </section>

    <!-- 分帳本 -->
    <div id="tab-tracker-content" class="space-y-4">
      <div class="bg-white border p-5 rounded-2xl shadow-sm">
        <p class="text-[10px] font-bold text-gray-400 uppercase">總花費</p>
        <p class="text-3xl font-black" id="dash-total">A$ 0.00</p>
      </div>
      <section class="bg-white p-5 rounded-2xl border-2 border-slate-900 shadow-md space-y-3">
        <h3 class="text-xs font-black uppercase border-b pb-2">✍️ 快速記帳 / 分帳</h3>
        <input type="text" id="edit-store" placeholder="店名" class="w-full p-2 bg-gray-50 border rounded-xl text-xs">
        <input type="number" id="edit-amount" value="0.00" class="w-full p-2 bg-gray-50 border rounded-xl text-xs font-bold text-pink-600">
        <div id="split-shares-container" class="space-y-1 bg-gray-50 p-2 rounded-xl text-xs"></div>
        <button onclick="saveBillFormCloud()" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs uppercase">同步至雲端</button>
      </section>

      <!-- 新增：隱藏式結算 -->
      <button onclick="document.getElementById('settlement-panel').classList.toggle('hidden')" class="w-full py-2 bg-slate-100 text-[10px] font-bold rounded-lg uppercase">📊 顯示/隱藏 對帳結算清單</button>
      <section id="settlement-panel" class="hidden bg-white border-2 border-dashed p-4 rounded-2xl space-y-2">
        <div id="settlement-matrix-box" class="space-y-2 text-xs"></div>
      </section>
      <ul id="expense-list" class="space-y-2"></ul>
    </div>

    <!-- 許願池 -->
    <div id="tab-wishlist-content" class="hidden space-y-4">
      <div class="flex gap-2">
        <select id="wish-cat-filter" onchange="streamWishesRender()" class="text-[10px] border p-2 rounded-xl w-full">
            <option value="all">全部分類</option><option value="餐廳">餐廳</option><option value="活動">活動</option><option value="景點">景點</option><option value="購物">購物</option><option value="其他">其他</option>
        </select>
        <button onclick="toggleWishForm()" class="bg-pink-500 text-white text-[10px] px-4 rounded-xl">+ 許願</button>
      </div>
      <div id="wishlist-cards-container" class="grid grid-cols-1 gap-3"></div>
    </div>
  </main>

  <script>
    // 補上投票與分類篩選邏輯
    window.voteWish = function(id, currentVotes) {
        db.collection("sydney_luxe_wishes").doc(id).update({ votes: (currentVotes || 0) + 1 });
    };

    function streamWishesRender() {
      const filter = document.getElementById('wish-cat-filter').value;
      const filtered = filter === 'all' ? currentWishes : currentWishes.filter(w => w.category === filter);
      const container = document.getElementById('wishlist-cards-container');
      container.innerHTML = filtered.map(w => `
        <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
            <div>
                <p class="text-xs font-bold">${w.title} <span class="text-[9px] bg-gray-100 px-1 rounded">${w.category || '其他'}</span></p>
                <p class="text-[10px] text-gray-500">票數: ${w.votes || 0}</p>
            </div>
            <button onclick="voteWish('${w.id}', ${w.votes})" class="text-[10px] bg-pink-100 text-pink-600 px-3 py-1 rounded-full">+1 投票</button>
        </div>
      `).join('');
    }

    // 更新行程表選項：在 renderItinerarySelectOptions() 中刪除 "Hotel" 那行選項即可
    function renderItinerarySelectOptions() {
        const select = document.getElementById('edit-itin-type');
        select.innerHTML = `<option value="Breakfast">🍳 早餐</option><option value="Lunch">🍝 午餐</option><option value="Dinner">🥩 晚餐</option><option value="Activity">🗺️ 行程景點</option>`;
    }
  </script>
</body>
</html>
