<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYD | Ultimate Group Hub</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    input[type="date"], input[type="time"], input[type="datetime-local"] { -webkit-appearance: none; box-sizing: border-box !important; max-width: 100% !important; }
  </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen pb-32 font-sans antialiased">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-xs">
    <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
      <h1 class="text-base font-black tracking-widest uppercase">SYDNEY <span class="text-pink-500">.</span> LUXE</h1>
      <button onclick="toggleLanguage()" class="text-[10px] font-black uppercase bg-pink-50 text-pink-600 px-3 py-2 rounded-full">🌐 EN</button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-6">

    <!-- TAB 1: LEDGER -->
    <div id="tab-tracker-content" class="space-y-4">
      <div class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm">
        <p class="text-[10px] font-bold text-gray-400 uppercase">本團澳幣總花費</p>
        <p class="text-3xl font-black text-slate-900 mt-1" id="dash-total">A$ 0.00</p>
      </div>

      <section class="bg-white p-5 rounded-2xl border-2 border-slate-900 shadow-md space-y-4">
        <h3 class="text-xs font-black uppercase border-b pb-2">✍️ 快速手動記帳 / 分帳</h3>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="edit-store" placeholder="店名" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs">
          <select id="edit-paid-by" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs"></select>
        </div>
        <input type="number" id="edit-amount" step="0.01" value="0.00" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs font-bold text-pink-600">
        <div id="split-shares-container" class="space-y-2 bg-gray-50 p-3 rounded-xl border"></div>
        <button onclick="saveBillFormCloud()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-xs uppercase">同步至雲端</button>
      </section>

      <!-- 隱藏式結算面板 -->
      <button onclick="toggleSettlement()" class="w-full py-2 bg-slate-100 text-slate-600 text-[10px] font-bold rounded-lg uppercase">顯示結算清單 / 隱藏</button>
      <section id="settlement-panel" class="hidden bg-white border-2 border-dashed border-slate-300 p-5 rounded-2xl shadow-xs space-y-3">
        <h3 class="text-xs font-black">📊 本團終極對帳結算</h3>
        <div id="settlement-matrix-box" class="space-y-2"></div>
      </section>

      <ul id="expense-list" class="space-y-2"></ul>
    </div>

    <!-- TAB 3: WISHLIST (分類 + 投票) -->
    <div id="tab-wishlist-content" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-[10px] font-bold uppercase">🎁 許願池</h2>
        <div class="flex gap-2">
            <select id="filter-wish-cat" onchange="streamWishesRender()" class="text-[10px] border p-1 rounded-full">
                <option value="all">全部分類</option>
                <option value="餐廳">餐廳</option>
                <option value="活動">活動</option>
                <option value="景點">景點</option>
                <option value="購物">購物</option>
            </select>
            <button onclick="toggleWishForm()" class="bg-pink-500 text-white text-[10px] px-3 py-1 rounded-full">+ 許願</button>
        </div>
      </div>

      <section id="wish-editor-panel" class="hidden bg-white p-5 rounded-2xl border-2 border-pink-400 space-y-3 shadow-xl">
        <input type="text" id="wish-field-title" placeholder="名稱" class="w-full p-2 bg-gray-50 border rounded-xl text-xs">
        <select id="wish-field-cat" class="w-full p-2 bg-gray-50 border rounded-xl text-xs">
            <option value="餐廳">餐廳</option><option value="活動">活動</option><option value="景點">景點</option><option value="購物">購物</option><option value="其他">其他</option>
        </select>
        <button onclick="saveWishNodeToCloud()" class="w-full bg-slate-900 text-white p-2 rounded-xl text-xs">拋入許願池</button>
      </section>

      <div id="wishlist-cards-container" class="grid grid-cols-1 gap-3"></div>
    </div>

  </main>

  <script>
    // [縮減後的重點邏輯]
    const EMBEDDED_FIREBASE_JSON = `{"apiKey":"AIzaSyDeP9DNQ66vSIxSfobvszadV-pRkT1pSoc","authDomain":"samuel-st-rent.firebaseapp.com","projectId":"samuel-st-rent","storageBucket":"samuel-st-rent.firebasestorage.app","messagingSenderId":"794096659826","appId":"1:794096659826:web:d99d862c67c94ce56f41eb","measurementId":"G-XCH2ZH980C"}`;
    const FIXED_MEMBERS = ['Sabrina', '中偉', '聖聖', '老麥', '倫倫'];
    let db = firebase.initializeApp(JSON.parse(EMBEDDED_FIREBASE_JSON)).firestore();

    // 對帳單開關
    function toggleSettlement() { document.getElementById('settlement-panel').classList.toggle('hidden'); }
    
    // 投票功能 (點擊按鈕 +1)
    window.voteWish = function(id, currentVotes) {
        db.collection("sydney_luxe_wishes").doc(id).update({ votes: (currentVotes || 0) + 1 });
    };

    // 許願池渲染 (增加投票與分類篩選)
    function streamWishesRender() {
      const cat = document.getElementById('filter-wish-cat').value;
      const container = document.getElementById('wishlist-cards-container');
      const filtered = cat === 'all' ? currentWishes : currentWishes.filter(w => w.cat === cat);
      
      container.innerHTML = filtered.map(w => `
        <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
            <div>
                <p class="text-xs font-bold">${w.title} <span class="text-[9px] bg-gray-100 px-1 rounded">${w.cat}</span></p>
                <p class="text-[10px] text-gray-500">票數: ${w.votes || 0}</p>
            </div>
            <button onclick="voteWish('${w.id}', ${w.votes})" class="text-[10px] bg-pink-100 text-pink-600 px-3 py-1 rounded-full">+1 投票</button>
        </div>
      `).join('');
    }

    // 初始化與其他函數省略 (請依序串接你的 Firebase 邏輯)
    // 記得補上 saveWishNodeToCloud 函數並加入 cat: document.getElementById('wish-field-cat').value
    
    bootstrapConfig();
  </script>
</body>
</html>
