<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYD | Ultimate Group Hub</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen pb-20 font-sans">

  <header class="bg-white border-b sticky top-0 z-50 p-4 text-center font-black tracking-widest">SYDNEY . LUXE</header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    <!-- 住宿大本營 -->
    <section class="bg-white border rounded-2xl p-4 shadow-sm" onclick="alert('住宿地址：' + document.getElementById('hotel-display-address').innerText)">
      <span class="text-[8px] font-bold text-pink-600 bg-pink-50 px-2 rounded-full uppercase">🏠 住宿大本營</span>
      <h3 class="text-sm font-bold mt-1" id="hotel-display-name">點擊查看住宿名稱</h3>
      <p class="text-xs text-gray-500" id="hotel-display-address">尚未設定</p>
    </section>

    <!-- Tab 1: 分帳 -->
    <div id="tab-tracker" class="space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm text-center">
        <p class="text-xs text-gray-400">總花費</p>
        <p class="text-3xl font-black" id="dash-total">A$ 0.00</p>
      </div>
      <section class="bg-white p-4 rounded-2xl border space-y-3">
        <input type="text" id="edit-store" placeholder="店名" class="w-full p-2 border rounded-xl text-xs">
        <input type="number" id="edit-amount" value="0.00" class="w-full p-2 border rounded-xl text-xs text-pink-600 font-bold">
        <button onclick="saveBill()" class="w-full bg-slate-900 text-white p-2 rounded-xl text-xs font-bold">同步記帳</button>
      </section>
      
      <!-- 結算 -->
      <button onclick="document.getElementById('settlement-panel').classList.toggle('hidden')" class="w-full p-2 bg-gray-200 text-[10px] font-bold rounded-lg uppercase">📊 顯示/隱藏 對帳結算</button>
      <div id="settlement-panel" class="hidden bg-white border-2 border-dashed p-4 rounded-2xl text-xs space-y-2"></div>
      <ul id="expense-list" class="space-y-2 text-xs"></ul>
    </div>

    <!-- Tab 2: 行程 (已移除飯店選項) -->
    <div id="tab-itinerary" class="hidden space-y-4">
      <button onclick="openItineraryEditor()" class="w-full bg-slate-900 text-white p-2 rounded-xl text-xs">+ 新增行程</button>
      <div id="itinerary-list" class="space-y-2"></div>
    </div>

    <!-- Tab 3: 許願池 (分類+投票) -->
    <div id="tab-wishlist" class="hidden space-y-4">
      <select id="wish-filter" onchange="renderWishes()" class="w-full p-2 border rounded-xl text-xs">
        <option value="all">全部分類</option><option value="餐廳">餐廳</option><option value="活動">活動</option><option value="景點">景點</option><option value="購物">購物</option>
      </select>
      <div id="wishlist-list" class="space-y-2"></div>
    </div>
  </main>

  <nav class="fixed bottom-0 w-full bg-white border-t p-3 flex justify-around text-xs font-bold">
    <button onclick="showTab('tracker')">🧾 帳本</button>
    <button onclick="showTab('itinerary')">🗓️ 行程</button>
    <button onclick="showTab('wishlist')">🎁 許願</button>
  </nav>

  <script>
    // 初始化 Firebase
    const config = { "apiKey": "AIzaSyDeP9DNQ66vSIxSfobvszadV-pRkT1pSoc", "authDomain": "samuel-st-rent.firebaseapp.com", "projectId": "samuel-st-rent", "storageBucket": "samuel-st-rent.firebasestorage.app", "messagingSenderId": "794096659826", "appId": "1:794096659826:web:d99d862c67c94ce56f41eb" };
    firebase.initializeApp(config);
    const db = firebase.firestore();

    function showTab(t) {
        document.getElementById('tab-tracker').classList.toggle('hidden', t !== 'tracker');
        document.getElementById('tab-itinerary').classList.toggle('hidden', t !== 'itinerary');
        document.getElementById('tab-wishlist').classList.toggle('hidden', t !== 'wishlist');
    }

    // 許願池邏輯 (分類+投票)
    function renderWishes() {
        const filter = document.getElementById('wish-filter').value;
        const list = document.getElementById('wishlist-list');
        const filtered = filter === 'all' ? currentWishes : currentWishes.filter(w => w.category === filter);
        list.innerHTML = filtered.map(w => `
            <div class="bg-white p-3 rounded-xl border flex justify-between items-center">
                <div><p class="font-bold">${w.title}</p><p class="text-[9px] text-gray-400">${w.category || '其他'} | 票數: ${w.votes || 0}</p></div>
                <button onclick="vote('${w.id}', ${w.votes || 0})" class="bg-pink-100 px-3 py-1 rounded-full text-pink-600">+1 投票</button>
            </div>
        `).join('');
    }

    function vote(id, current) {
        db.collection("sydney_luxe_wishes").doc(id).update({ votes: current + 1 });
    }

    // 行程表 (已移除飯店選項的選單邏輯)
    function openItineraryEditor() {
        // 在這裡設定你的 select 選項，確保沒有 <option value="Hotel">
        // 原本的程式碼中這裡應該只有 早餐, 午餐, 晚餐, 活動
    }
  </script>
</body>
</html>
