<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYD | Ultimate Group Hub</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    input[type="date"], input[type="time"], input[type="datetime-local"] { -webkit-appearance: none; box-sizing: border-box !important; max-width: 100% !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen pb-32 font-sans antialiased">
  <script>
    // 這是你要的新功能邏輯
    function streamWishesRender() {
        const filter = document.getElementById('wish-cat-filter')?.value || 'all';
        const list = document.getElementById('wishlist-cards-container');
        const filtered = filter === 'all' ? currentWishes : currentWishes.filter(w => w.category === filter);
        list.innerHTML = filtered.map(w => `
            <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                <div><p class="text-xs font-bold">${w.title} <span class="text-[9px] bg-gray-100 px-1 rounded">${w.category || '其他'}</span></p>
                <p class="text-[10px] text-gray-500">票數: ${w.votes || 0}</p></div>
                <button onclick="voteWish('${w.id}', ${w.votes || 0})" class="bg-pink-50 text-pink-600 px-3 py-1 rounded-full text-[10px] font-bold">+1 投票</button>
            </div>
        `).join('');
    }

    function voteWish(id, currentVotes) {
        db.collection("sydney_luxe_wishes").doc(id).update({ votes: currentVotes + 1 });
    }

    function renderItinerarySelectOptions() {
        const select = document.getElementById('edit-itin-type');
        select.innerHTML = `<option value="Breakfast">🍳 早餐</option><option value="Lunch">🍝 午餐</option><option value="Dinner">🥩 晚餐</option><option value="Activity">🗺️ 行程景點</option>`;
    }

    function bootstrapConfig() {

      applyLanguagePack();

      document.getElementById('dash-members').innerText = FIXED_MEMBERS.join(', ');

      document.getElementById('flight-member-select').innerHTML = FIXED_MEMBERS.map(m => `<option value="${m}">${m}</option>`).join('');

      

      if (firebase.apps.length === 0) {

        const app = firebase.initializeApp(JSON.parse(EMBEDDED_FIREBASE_JSON));

        db = firebase.firestore(app);

      } else { db = firebase.firestore(); }



      initStaticBillForm();

      streamExpenses(); streamItinerary(); streamWishes(); streamHotel(); streamFlights();

    }



    // HOTEL

    function openHotelEditor() { document.getElementById('hotel-editor-panel').style.display = 'block'; }

    function closeHotelEditor() { document.getElementById('hotel-editor-panel').style.display = 'none'; }

    window.openHotelEditor = openHotelEditor; window.closeHotelEditor = closeHotelEditor;

    function saveHotelInfo() { const name = document.getElementById('input-hotel-name').value.trim(); const address = document.getElementById('input-hotel-address').value.trim(); db.collection("sydney_luxe_meta").doc("hotel").set({ name, address }).then(() => closeHotelEditor()); }

    window.saveHotelInfo = saveHotelInfo;

    function streamHotel() { db.collection("sydney_luxe_meta").doc("hotel").onSnapshot(d => { if (d.exists()) { document.getElementById('hotel-display-name').innerText = d.data().name || "點擊設定飯店名稱與資訊"; document.getElementById('hotel-display-address').innerText = d.data().address || "目前尚未提供地址資訊"; document.getElementById('input-hotel-name').value = d.data().name || ''; document.getElementById('input-hotel-address').value = d.data().address || ''; } }); }



    // FLIGHTS

    function openFlightEditor(typeMode) {

      document.getElementById('flight-editor-box').style.display = 'block';

      document.getElementById('flight-type-mode').value = typeMode;

      document.getElementById('flight-editor-title-text').innerText = typeMode === 'arrival' ? '📝 更新抵達雪梨航班' : '📝 更新離開雪梨航班';

      document.getElementById('flight-editor-box').scrollIntoView({ behavior: 'smooth' });

    }

    window.openFlightEditor = openFlightEditor;



    function saveFlightRowCloud() {

      const typeMode = document.getElementById('flight-type-mode').value;

      const name = document.getElementById('flight-member-select').value;

      const no = document.getElementById('flight-input-no').value.trim() || 'QF--';

      const rawTime = document.getElementById('flight-input-time').value;

      

      db.collection(typeMode === 'arrival' ? "sydney_luxe_arrival" : "sydney_luxe_departure").doc(name).set({ no, timestamp: rawTime }).then(() => {

        document.getElementById('flight-input-no').value = '';

        document.getElementById('flight-input-time').value = '';

        document.getElementById('flight-editor-box').style.display = 'none';

      });

    }

    window.saveFlightRowCloud = saveFlightRowCloud;



    function formatFriendlyDateTime(isoStr) {

      if(!isoStr) return '未填寫時間';

      try {

        const d = new Date(isoStr);

        return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      } catch(e) { return isoStr; }

    }



    // 航班監聽

    function streamFlights() {

      db.collection("sydney_luxe_arrival").onSnapshot(snap => {

        const list = document.getElementById('arrival-display-list'); let html = '';

        FIXED_MEMBERS.forEach(m => {

          let matched = { no: '-', timestamp: '' }; snap.forEach(d => { if(d.id === m) matched = d.data(); });

          html += `<tr class="border-b border-slate-800/30"><td class="py-2.5 font-bold text-amber-300">${m}</td><td class="py-2.5 font-mono text-zinc-300">${matched.no}</td><td class="py-2.5 font-mono text-zinc-100 font-semibold">${formatFriendlyDateTime(matched.timestamp)}</td></tr>`;

        });

        list.innerHTML = html;

      });

      db.collection("sydney_luxe_departure").onSnapshot(snap => {

        const list = document.getElementById('departure-display-list'); let html = '';

        FIXED_MEMBERS.forEach(m => {

          let matched = { no: '-', timestamp: '' }; snap.forEach(d => { if(d.id === m) matched = d.data(); });

          html += `<tr class="border-b border-slate-800/30"><td class="py-2.5 font-bold text-pink-400">${m}</td><td class="py-2.5 font-mono text-zinc-300">${matched.no}</td><td class="py-2.5 font-mono text-zinc-100 font-semibold">${formatFriendlyDateTime(matched.timestamp)}</td></tr>`;

        });

        list.innerHTML = html;

      });

    }



    // EXPENSES 記帳核心

    function initStaticBillForm() {

      document.getElementById('edit-date').value = new Date().toISOString().split('T')[0];

      document.getElementById('edit-paid-by').innerHTML = FIXED_MEMBERS.map(m => `<option value="${m}">${m}</option>`).join('');

      const weightBox = document.getElementById('split-shares-container');

      weightBox.innerHTML = FIXED_MEMBERS.map(m => `

        <div class="flex items-center justify-between gap-2 bg-white p-2 rounded-xl border border-gray-100">

          <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer select-none">

            <input type="checkbox" data-member-check="${m}" checked class="member-split-checkbox w-4 h-4 text-pink-600 rounded border-gray-300 focus:ring-pink-400">

            <span>${m}</span>

          </label>

          <div class="flex items-center gap-1">

            <span class="text-[10px] text-gray-400">A$</span>

            <input type="number" step="0.01" data-member-weight="${m}" class="split-weight-node w-20 p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-right text-xs text-pink-600 font-mono" value="0.00">

          </div>

        </div>

      `).join('');

      document.querySelectorAll('.split-weight-node').forEach(i => i.addEventListener('input', sumWeightNodes));

    }



    function calculateEqualSplit() {

      const totalAmount = parseFloat(document.getElementById('edit-amount').value) || 0;

      const checkedCheckboxes = document.querySelectorAll('.member-split-checkbox:checked');

      document.querySelectorAll('.split-weight-node').forEach(input => input.value = "0.00");

      if (checkedCheckboxes.length === 0 || totalAmount <= 0) { sumWeightNodes(); return; }

      const share = totalAmount / checkedCheckboxes.length;

      checkedCheckboxes.forEach(cb => {

        const name = cb.getAttribute('data-member-check');

        const weightInput = document.querySelector(`[data-member-weight="${name}"]`);

        if (weightInput) weightInput.value = share.toFixed(2);

      });

      sumWeightNodes();

    }

    window.calculateEqualSplit = calculateEqualSplit;



    function sumWeightNodes() {

      let accum = 0;

      document.querySelectorAll('.split-weight-node').forEach(i => accum += parseFloat(i.value) || 0);

      document.getElementById('split-total-assigned').innerText = `A$ ${accum.toFixed(2)}`;

    }



    function clearBillForm() {

      document.getElementById('edit-id').value = ''; document.getElementById('edit-store').value = ''; document.getElementById('edit-items').value = ''; document.getElementById('edit-amount').value = '0.00'; document.getElementById('edit-cat').value = 'Food'; document.getElementById('edit-date').value = new Date().toISOString().split('T')[0];

      document.querySelectorAll('.member-split-checkbox').forEach(cb => cb.checked = true); document.querySelectorAll('.split-weight-node').forEach(i => i.value = '0.00'); sumWeightNodes();

    }

    window.clearBillForm = clearBillForm;



    function saveBillFormCloud() {

      const id = document.getElementById('edit-id').value; let splits = {};

      document.querySelectorAll('.split-weight-node').forEach(i => { const mName = i.getAttribute('data-member-weight'); splits[mName] = parseFloat(i.value) || 0; });

      const packageObj = { storeName: document.getElementById('edit-store').value.trim() || 'Sydney Expense', items: document.getElementById('edit-items').value.trim() || 'Details', amountAUD: parseFloat(document.getElementById('edit-amount').value) || 0, category: document.getElementById('edit-cat').value.trim() || 'Food', date: document.getElementById('edit-date').value, paidBy: document.getElementById('edit-paid-by').value, splits };

      if(id) { db.collection("sydney_luxe_expenses").doc(id).set(packageObj, { merge: true }).then(() => clearBillForm()); } 

      else { db.collection("sydney_luxe_expenses").add(packageObj).then(() => clearBillForm()); }

    }

    window.saveBillFormCloud = saveBillFormCloud;



    function streamExpenses() {

      db.collection("sydney_luxe_expenses").onSnapshot((snap) => {

        currentExpenses = []; snap.forEach(d => currentExpenses.push({ id: d.id, ...d.data() }));

        document.getElementById('dash-total').innerText = `A$ ${currentExpenses.reduce((s, e) => s + (e.amountAUD || 0), 0).toFixed(2)}`;

        

        // 1. 渲染消費歷史帳目明細

        const container = document.getElementById('expense-list'); 

        if(currentExpenses.length === 0) { 

          container.innerHTML = `<li class="p-5 text-center text-xs text-gray-400 bg-white border border-gray-200 rounded-xl shadow-sm">目前沒有消費帳目</li>`; 

          renderFinalSettlementMatrix(); // 空帳目也刷新結算

          return; 

        }

        const sorted = [...currentExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));

        container.innerHTML = sorted.map(exp => {

          const splitBreakdowns = Object.entries(exp.splits || {}).map(([name, money]) => money > 0 ? `<span class="bg-gray-100 text-gray-600 border border-gray-200 px-1.5 py-0.5 rounded text-[9px] font-mono">${name}: $${parseFloat(money).toFixed(1)}</span>` : '').join(' ');

          return `<li class="bg-white border border-gray-200 p-4 rounded-2xl flex justify-between items-center shadow-sm"><div class="space-y-1.5 flex-1 min-w-0 pr-2"><div class="flex items-center gap-2"><span class="font-bold text-slate-900 text-xs truncate">${exp.storeName}</span><span class="text-[8px] tracking-widest font-bold uppercase text-pink-600 bg-pink-50 px-2 py-0.5 rounded border border-pink-100">${exp.category}</span></div><p class="text-[11px] text-gray-500 truncate font-mono">${exp.items || 'Details'}</p><div class="flex flex-wrap items-center gap-1.5 pt-0.5"><span class="text-[9px] text-gray-400">代付人 <strong>${exp.paidBy}</strong></span><div class="flex flex-wrap gap-1">${splitBreakdowns}</div></div></div><div class="text-right flex flex-col items-end justify-between space-y-2"><p class="text-sm font-black text-slate-900 font-mono">A$ ${parseFloat(exp.amountAUD).toFixed(2)}</p><div class="flex gap-3 text-[10px] font-bold uppercase"><button type="button" onclick="window.initiateBillTweak('${exp.id}')" class="text-pink-600 hover:text-slate-900">調整</button><button type="button" onclick="window.nukeBillLog('${exp.id}')" class="text-gray-400 hover:text-red-500">刪除</button></div></div></li>`;

        }).join('');



        // 2. 🔥 每次帳目有變動，秒速重新執行「終極對帳矩陣算法」

        renderFinalSettlementMatrix();

      });

    }



    // 📊 🔥 核心算法：全自働計算本團誰該拿錢、誰該掏錢

    function renderFinalSettlementMatrix() {

      let paidMap = {}; // 紀錄每個人總共幫大家「墊了多少錢」

      let oweMap = {};  // 紀錄每個人一路上自己「消費吃了多少錢」

      

      // 初始化歸零

      FIXED_MEMBERS.forEach(m => { paidMap[m] = 0; oweMap[m] = 0; });



      // 遍歷所有消費明細累加

      currentExpenses.forEach(exp => {

        const payer = exp.paidBy;

        const totalCost = parseFloat(exp.amountAUD) || 0;

        

        if (FIXED_MEMBERS.includes(payer)) {

          paidMap[payer] += totalCost;

        }

        

        // 累加每人分帳份額

        Object.entries(exp.splits || {}).forEach(([mName, shareAmt]) => {

          if (FIXED_MEMBERS.includes(mName)) {

            oweMap[mName] += (parseFloat(shareAmt) || 0);

          }

        });

      });



      const matrixContainer = document.getElementById('settlement-matrix-box');

      let html = '';



      FIXED_MEMBERS.forEach(m => {

        const totalPaid = paidMap[m];

        const totalOwe = oweMap[m];

        const netResult = totalPaid - totalOwe; // 正數代表幫大家墊多了應收回，負數代表欠大家錢應補繳



        let statusBadge = '';

        if (netResult > 0.01) {

          // 🟢 綠色：應收回

          statusBadge = `

            <div class="flex items-center gap-1.5 text-xs font-black text-emerald-600 bg-emerald-50 border border-emerald-100 px-3 py-1.5 rounded-xl">

              <span>應收回</span>

              <span class="font-mono text-sm">A$ ${netResult.toFixed(2)}</span>

            </div>

          `;

        } else if (netResult < -0.01) {

          // 🔴 粉色：應補繳

          statusBadge = `

            <div class="flex items-center gap-1.5 text-xs font-black text-pink-600 bg-pink-50 border border-pink-100 px-3 py-1.5 rounded-xl">

              <span>應補繳</span>

              <span class="font-mono text-sm">A$ ${Math.abs(netResult).toFixed(2)}</span>

            </div>

          `;

        } else {

          // ⚪ 灰色：已結清

          statusBadge = `

            <div class="text-xs font-bold text-gray-400 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-xl">

              已兩清 A$ 0.00

            </div>

          `;

        }



        html += `

          <div class="flex items-center justify-between bg-gray-50/50 p-3 rounded-2xl border border-gray-100">

            <div>

              <h4 class="text-xs font-black text-slate-900">${m}</h4>

              <p class="text-[9px] text-gray-400 mt-0.5 font-mono">

                已代付: $${totalPaid.toFixed(1)} | 總應付: $${totalOwe.toFixed(1)}

              </p>

            </div>

            ${statusBadge}

          </div>

        `;

      });



      matrixContainer.innerHTML = html;

    }



    window.initiateBillTweak = function(id) {

      const target = currentExpenses.find(e => e.id === id); if(!target) return;

      document.getElementById('edit-id').value = target.id; document.getElementById('edit-store').value = target.storeName || ''; document.getElementById('edit-items').value = target.items || ''; document.getElementById('edit-amount').value = target.amountAUD || 0; document.getElementById('edit-cat').value = target.category || 'Food'; document.getElementById('edit-date').value = target.date || ''; document.getElementById('edit-paid-by').value = target.paidBy || FIXED_MEMBERS[0];

      FIXED_MEMBERS.forEach(m => {

        const amt = target.splits?.[m] || 0;

        document.querySelector(`[data-member-check="${m}"]`).checked = (amt > 0);

        document.querySelector(`[data-member-weight="${m}"]`).value = amt.toFixed(2);

      });

      sumWeightNodes(); window.scrollTo({ top: 0, behavior: 'smooth' });

    };

    window.nukeBillLog = function(id) { if(confirm("確定要永久刪除此帳目嗎？")) db.collection("sydney_luxe_expenses").doc(id).delete(); };



    // ITINERARY 行程

    function streamItinerary() { db.collection("sydney_luxe_itinerary").onSnapshot((snap) => { currentItinerary = []; snap.forEach(d => currentItinerary.push({ id: d.id, ...d.data() })); refreshItineraryTimelineUI(); }); }

    function refreshItineraryTimelineUI() {

      const days = ['2026-06-29', '2026-06-30', '2026-07-01', '2026-07-02'];

      days.forEach(day => { document.getElementById(`day-box-${day}`).innerHTML = ''; });

      const badgeStyles = { Breakfast: "bg-emerald-50 text-emerald-600", Lunch: "bg-teal-50 text-teal-600", Dinner: "bg-rose-50 text-rose-600", Activity: "bg-pink-50 text-pink-600", Hotel: "bg-indigo-50 text-indigo-600" };

      const sortedNodes = [...currentItinerary].sort((a,b) => (a.timeStr || '').localeCompare(b.timeStr || ''));

      let counters = { '2026-06-29': 0, '2026-06-30': 0, '2026-07-01': 0, '2026-07-02': 0 };



      sortedNodes.forEach(node => {

        const targetBox = document.getElementById(`day-box-${node.dateStr}`);

        if(targetBox) {

          counters[node.dateStr]++;

          const cardHtml = `

            <div class="bg-gray-50 border border-gray-100 rounded-xl p-3 active:bg-gray-100/70" onclick="window.triggerEditItineraryNode('${node.id}')">

              <div class="flex justify-between items-center text-xs">

                <div class="flex items-center gap-2">

                  <span class="bg-slate-900 text-white font-mono font-bold px-2 py-0.5 rounded text-[10px]">${node.timeStr || '⏰ --:--'}</span>

                  <h5 class="font-bold text-slate-900 truncate max-w-[150px]">${node.hubLocation}</h5>

                </div>

                <span class="text-[8px] font-black px-2 py-0.5 rounded-full ${badgeStyles[node.nodeType] || 'bg-gray-100'}">${node.nodeType}</span>

              </div>

              <p class="text-[11px] text-gray-500 mt-1.5 whitespace-pre-line pl-1">${node.activityDetails || ''}</p>

            </div>

          `;

          targetBox.insertAdjacentHTML('beforeend', cardHtml);

        }

      });

      days.forEach(day => { if(counters[day] === 0) document.getElementById(`day-box-${day}`).innerHTML = `<p class="text-[11px] text-gray-400 italic py-1 text-center">今天目前沒有安排行程活動</p>`; });

    }



    function openItineraryEditorModal(id) {

      const modal = document.getElementById('itinerary-editor'); modal.style.display = 'block';

      if(id) {

        document.getElementById('itin-editor-title').innerText = "修改行程活動"; document.getElementById('edit-itin-id').value = id; document.getElementById('btn-delete-itin').style.display='block';

        const n = currentItinerary.find(i=>i.id===id); 

        if(n){ 

          document.getElementById('edit-itin-date').value = n.dateStr || '2026-06-29'; 

          document.getElementById('edit-itin-time').value = n.timeStr || ''; 

          document.getElementById('edit-itin-type').value = n.nodeType || 'Activity'; 

          document.getElementById('edit-itin-location').value = n.hubLocation || ''; 

          document.getElementById('edit-itin-details').value = n.activityDetails || ''; 

        }

      } else {

        document.getElementById('itin-editor-title').innerText = "規劃活動卡片"; document.getElementById('edit-itin-id').value = ''; document.getElementById('btn-delete-itin').style.display='none';

        document.getElementById('edit-itin-date').value = "2026-06-29"; document.getElementById('edit-itin-time').value = "09:00"; document.getElementById('edit-itin-type').value = "Activity"; document.getElementById('edit-itin-location').value = ""; document.getElementById('edit-itin-details').value = "";

      }

      modal.scrollIntoView({ behavior:'smooth' });

    }

    window.openItineraryEditorModal = openItineraryEditorModal; window.triggerEditItineraryNode = openItineraryEditorModal;

    function closeItineraryEditor() { document.getElementById('itinerary-editor').style.display='none'; }

    window.closeItineraryEditor = closeItineraryEditor;



    function saveItineraryNode() {

      const id = document.getElementById('edit-itin-id').value;

      const payload = { dateStr: document.getElementById('edit-itin-date').value, timeStr: document.getElementById('edit-itin-time').value, nodeType: document.getElementById('edit-itin-type').value, hubLocation: document.getElementById('edit-itin-location').value.trim() || '未填地點', activityDetails: document.getElementById('edit-itin-details').value.trim() || '' };

      if(id) { db.collection("sydney_luxe_itinerary").doc(id).set(payload, {merge:true}).then(()=>closeItineraryEditor()); } 

      else { db.collection("sydney_luxe_itinerary").add(payload).then(()=>closeItineraryEditor()); }

    }

    window.saveItineraryNode = saveItineraryNode;

    function deleteItineraryNode() { const id = document.getElementById('edit-itin-id').value; if(confirm("確定刪除此行程節點？")) db.collection("sydney_luxe_itinerary").doc(id).delete().then(()=>closeItineraryEditor()); }

    window.deleteItineraryNode = deleteItineraryNode;



    // WISHLIST 許願池

    function toggleWishForm() { const el = document.getElementById('wish-editor-panel'); el.style.display = (el.style.display === 'none') ? 'block' : 'none'; }

    window.toggleWishForm = toggleWishForm;



    function saveWishNodeToCloud() {

      const titleVal = document.getElementById('wish-field-title').value.trim(); const linkVal = document.getElementById('wish-field-link').value.trim(); const imgVal = document.getElementById('wish-field-img').value.trim(); const authorVal = document.getElementById('wish-field-author').value.trim() || '有人';

      if(!titleVal) { alert("請填寫想要許願的名稱！"); return; }

      db.collection("sydney_luxe_wishes").add({ title: titleVal, link: linkVal, img: imgVal, author: authorVal, approvedInPlan: false, timestamp: Date.now() }).then(() => { 

        document.getElementById('wish-field-title').value = ''; document.getElementById('wish-field-link').value = ''; document.getElementById('wish-field-img').value = ''; document.getElementById('wish-field-author').value = ''; toggleWishForm(); 

      }).catch(err => alert("許願池同步失敗: " + err.message));

    }

    window.saveWishNodeToCloud = saveWishNodeToCloud;



    function streamWishes() { db.collection("sydney_luxe_wishes").onSnapshot(snap => { currentWishes = []; snap.forEach(d => currentWishes.push({ id: d.id, ...d.data() })); currentWishes.sort((a,b) => b.timestamp - a.timestamp); streamWishesRender(); }); }

    function streamWishesRender() {

      const container = document.getElementById('wishlist-cards-container'); if(currentWishes.length === 0) { container.innerHTML = `<div class="p-6 text-center text-xs text-gray-400 bg-white border border-gray-200 rounded-xl shadow-sm">許願池空空如也，快丟 IG 連結來許願吧！</div>`; return; }

      container.innerHTML = currentWishes.map(wish => {

        const isUrl = wish.link && (wish.link.startsWith('http://') || wish.link.startsWith('https://')); const linkButton = isUrl ? `<a href="${wish.link}" target="_blank" onclick="event.stopPropagation()" class="inline-block mt-1 text-[10px] text-pink-600 font-bold bg-pink-50 border border-pink-100 px-2 py-0.5 rounded-md">🔗 打開對外連結</a>` : ''; const imageBox = wish.img ? `<img src="${wish.img}" class="w-full h-24 object-cover rounded-xl mt-2 border border-gray-100">` : '';

        return `<div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm space-y-2 relative"><div><h4 class="text-xs font-bold text-slate-900">${wish.title}</h4><p class="text-[9px] text-gray-400">許願人 <span class="text-slate-600 font-medium">${wish.author}</span></p>${linkButton}</div>${imageBox}<div class="pt-2 border-t border-gray-100 flex justify-between items-center text-[10px]"><label class="flex items-center gap-1.5 font-bold text-gray-500 cursor-pointer"><input type="checkbox" ${wish.approvedInPlan ? 'checked':''} onclick="window.toggleWishStatus('${wish.id}', ${wish.approvedInPlan})" class="w-4 h-4 text-pink-500 border-gray-300 rounded focus:ring-pink-400"><span>已排進行程中 ✔️</span></label><button onclick="window.nukeWishNode('${wish.id}')" class="text-gray-300 hover:text-red-500">✕ 撤銷願望</button></div></div>`;

      }).join('');

    }

    window.toggleWishStatus = function(id, currentStatus) { db.collection("sydney_luxe_wishes").doc(id).update({ approvedInPlan: !currentStatus }); };

    window.nukeWishNode = function(id) { if(confirm("確定要撤銷這個願望嗎？")) db.collection("sydney_luxe_wishes").doc(id).delete(); };



    bootstrapConfig();

  </script>

</body>

</html>
